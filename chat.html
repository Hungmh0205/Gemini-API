<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Chat Test</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<!-- KaTeX: bản vendor trong repo, KHÔNG dùng CDN (dự án chạy offline). -->
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
  :root { --bg:#0f1115; --panel:#161a22; --bubble:#1f2630; --accent:#4f8cff; --text:#e6e9ef; --muted:#9aa3b2; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; background:var(--panel); display:flex; gap:10px; align-items:center; border-bottom:1px solid #232a36; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; color:var(--accent); }
  header .logo { width:24px; height:24px; flex:none; }
  header input, header select { background:#0d1016; border:1px solid #2a3242; color:var(--text); padding:6px 10px; border-radius:8px; font-size:13px; }
  #apiKey { flex:1; min-width:200px; }
  #model { width:170px; }
  #messages { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:72%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.ai { align-self:flex-start; background:var(--bubble); }
  .msg b.role { font-size:11px; color:var(--muted); display:block; margin-bottom:4px; }
  .msg img { display:block; max-width:220px; margin:6px 0; border-radius:8px; }
  .msg.error { align-self:center; background:#3a1f24; color:#ffb3b3; }
  #composer { background:var(--panel); border-top:1px solid #232a36; padding:12px 16px; display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  #input { flex:1; min-height:44px; resize:vertical; background:#0d1016; border:1px solid #2a3242; color:var(--text); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; }
  #attachments { display:flex; gap:8px; flex-wrap:wrap; width:100%; }
  .thumb { position:relative; }
  .thumb img { width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid #2a3242; }
  .thumb button { position:absolute; top:-6px; right:-6px; width:18px; height:18px; border:none; border-radius:50%; background:#e5484d; color:#fff; cursor:pointer; font-size:11px; line-height:18px; }
  .filetag { display:inline-flex; align-items:center; gap:6px; max-width:260px; padding:6px 10px; background:#161b24; border:1px solid #2a3242; border-radius:8px; font-size:12px; }
  .filetag span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
  .filetag small { color:var(--muted); font-size:10px; }
  .media { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .media figure { margin:0; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .media img { max-width:min(100%,420px); border-radius:10px; border:1px solid #2a3242; }
  .media video { max-width:min(100%,480px); border-radius:10px; }
  .media audio { width:min(100%,420px); }
  .media button.dl { background:#1c2330; border:1px solid #2a3242; color:var(--text); border-radius:8px; padding:5px 10px; font-size:12px; }
  .loading { color:var(--muted); font-size:12px; }
  .cblk { position:relative; }
  .cblk .dlcode { position:absolute; top:6px; right:6px; z-index:2; background:#1c2330; border:1px solid #2a3242; color:var(--text); border-radius:6px; padding:3px 8px; font-size:11px; opacity:.85; }
  .cblk .dlcode:hover { opacity:1; }
  button { cursor:pointer; }
  #send, #attach { background:var(--accent); border:none; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; }
  #attach { background:#2a3242; }
  #send:disabled { opacity:.5; cursor:default; }
  .hint { font-size:11px; color:var(--muted); align-self:center; }

  /* ---------- Markdown trong tin nhắn ----------
     `.msg` mặc định `white-space:pre-wrap` để hiện nguyên văn bản thô. Khi bật
     markdown thì phải trả lại `normal`, nếu không mọi xuống dòng trong `<p>` và
     `<li>` sẽ bị nhân đôi. */
  .md { white-space:normal; }
  .md > *:first-child { margin-top:0; }
  .md > *:last-child { margin-bottom:0; }
  .md p { margin:0 0 8px; }
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { margin:12px 0 6px; line-height:1.3; }
  .md h1 { font-size:19px; } .md h2 { font-size:17px; }
  .md h3 { font-size:15px; } .md h4,.md h5,.md h6 { font-size:14px; }
  .md ul,.md ol { margin:0 0 8px; padding-left:22px; }
  .md li { margin:2px 0; }
  .md li > ul, .md li > ol { margin:2px 0; }
  .md code { background:#0d1016; border:1px solid #2a3242; border-radius:4px; padding:1px 5px; font-family:Consolas,"Cascadia Mono",monospace; font-size:12.5px; }
  .md-pre { background:#0d1016; border:1px solid #2a3242; border-radius:8px; padding:10px 12px; overflow-x:auto; margin:0 0 8px; position:relative; }
  .md-pre code { background:none; border:none; padding:0; white-space:pre; display:block; }
  .md-pre[data-lang]::before { content:attr(data-lang); position:absolute; top:6px; right:8px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .md blockquote { margin:0 0 8px; padding:2px 0 2px 12px; border-left:3px solid #2a3242; color:var(--muted); }
  .md table { border-collapse:collapse; margin:0 0 8px; font-size:13px; display:block; overflow-x:auto; max-width:100%; }
  .md th,.md td { border:1px solid #2a3242; padding:5px 9px; text-align:left; }
  .md th { background:#0d1016; }
  .md hr { border:none; border-top:1px solid #232a36; margin:10px 0; }
  .md a { color:var(--accent); }
  .md-img { max-width:100%; border-radius:8px; display:block; margin:6px 0; }
  .md del { color:var(--muted); }

  /* Toán học (KaTeX). Công thức rộng phải cuộn ngang, nếu không tràn ngang
     làm cả khung chat giãn ra. */
  .md .katex { font-size:1.06em; }
  .md-mathblock { display:block; overflow-x:auto; overflow-y:hidden; margin:8px 0; padding:2px 0; }
  .md-mathblock .katex-display { margin:0; }
  /* Fallback khi KaTeX không tải được hoặc LaTeX sai cú pháp: hiện nguyên
     mã nguồn thay vì mất trắng. */
  .md-raw { color:#ffb4a2; background:#2a1b1b; border:1px solid #5a2f2a; white-space:pre-wrap; }
  /* [cite: N] của Gemini -> chip trích dẫn gọn như web Gemini. */
  .md-cite { color:var(--accent); font-size:.72em; font-weight:600; cursor:help; margin-left:1px; }

  /* Chế độ raw: hiện đúng chuỗi Gemini trả về, không diễn giải gì cả. */
  #messages.raw .md { white-space:pre-wrap; font-family:Consolas,"Cascadia Mono",monospace; font-size:12.5px; color:#cbd3e1; }
  #messages.raw .md-pre { white-space:normal; }

  #mdToggle.on { background:#2f6b4f; color:#fff; }
</style>
</head>
<body>
<header>
  <img class="logo" src="/logo.png" alt="Lumi">
  <h1>Gemini Chat Test</h1>
  <input id="apiKey" placeholder="API Key (lưu tự động)">
  <input id="model" placeholder="model (để trống = mặc định)" value="gemini-flash">
  <button id="mdToggle" class="on" title="Bật/tắt hiển thị markdown. Tắt để xem nguyên văn Gemini trả về.">Markdown</button>
  <button id="clear" style="background:#2a3242;border:none;color:#fff;padding:6px 12px;border-radius:8px">Reset</button>
</header>

<div id="messages"><div class="hint">Gõ tin nhắn bên dưới để test API. Bấm nút &#128206; để đính kèm file (ảnh, tài liệu, code, zip...).</div></div>

<div id="composer">
  <div id="attachments"></div>
  <textarea id="input" placeholder="Nhập tin nhắn..."></textarea>
  <button id="attach" title="Đính kèm file (ảnh, tài liệu, code, zip)">&#128206;</button>
  <button id="send">Gửi</button>
</div>

<input type="file" id="file" multiple hidden>

<!-- KaTeX phải nạp TRƯỚC script chính: renderer bên dưới gọi katex.render(). -->
<script src="/vendor/katex/katex.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const msgs = [];
let attachments = [];

const apiKey = localStorage.getItem("gemini_api_key") || "";
$("apiKey").value = apiKey;
$("apiKey").addEventListener("input", () => {
  localStorage.setItem("gemini_api_key", $("apiKey").value.trim());
});

/* =============================================================================
 * Markdown
 *
 * Tự viết thay vì kéo marked.js từ CDN: dự án này cố ý chạy offline (xem
 * README), nên một thẻ <script src="https://..."> là mất trắng toàn bộ khả
 * năng render khi máy không có mạng — tức là hỏng đúng lúc bạn debug.
 *
 * Thứ tự cố ý: escape HTML TRƯỚC, rồi mới chèn thẻ. Nội dung do Gemini sinh ra
 * và server là proxy của nó, nên không thể tin: nếu render trực tiếp chuỗi
 * gốc thì một câu trả lời chứa <img onerror=...> hay [x](javascript:...) sẽ
 * chạy được trong máy người dùng.
 * ========================================================================== */
let MD_ON = localStorage.getItem("gemini_md") !== "0";

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Chỉ cho http/https/mailto. `javascript:` bị chặn ở đây chứ không phải ở
// chỗ dùng, để không sót đường nào sau này.
function safeUrl(u) {
  const s = String(u).trim();
  return /^(https?:\/\/|mailto:)/i.test(s) ? s : "";
}

/* Render một công thức bằng KaTeX, tự hạ nếu KaTeX lỗi/lỡ vendor.
   `displayMode` bọc trong <span class="md-mathblock"> chứ không để KaTeX tự sinh
   <div class="katex-display">: phần lớn công thức nằm giữa <p>, mà <div> nằm
   trong <p> là HTML không hợp lệ và trình duyệt sẽ tự dựng lại cây DOM. */
function renderMath(latex, display) {
  const fb = "<code class='md-raw'>" + esc(latex) + "</code>";
  if (typeof katex === "undefined") return fb;
  try {
    const html = katex.renderToString(latex, {
      displayMode: !!display,
      throwOnError: false,   // lỗi cú pháp -> hiện LaTeX gốc, không ném exception
      strict: "ignore",       // chấp nhận cả mã LaTeX "không chuẩn" Gemini hay sinh
      trust: false,           // KHÔNG cho \href/\url mở javascript: hay nhúng frame
      maxSize: 40,            // chặn script siêu lớn gây treo tab
      maxExpand: 1000,
      output: "html",
    });
    return display ? '<span class="md-mathblock">' + html + "</span>" : html;
  } catch (e) {
    return fb;
  }
}

/* Render phần trong một dòng. Input là TEXT THÔ, tự escape bên trong.

   Thứ tự rất quan trọng và không thể đảo:
     1. code inline  -> placeholder   (backtick là biên, `$` bên trong là text)
     2. $$...$$      -> placeholder   (trước $...$ vì $$ chứa $)
     3. $...$        -> placeholder
     4. escape phần còn lại
     5. bold/italic/link/...
     6. render lại placeholder
   Phải tách math TRƯỚC khi escape: LaTeX có ký tự `&` và `<` (`\begin{cases}`,
   `\begin{array}{cc}`), escape trước sẽ biến chúng thành `&amp;` `&lt;` và
   KaTeX sẽ in ra đúng những ký tự đó thay vì canh chỉnh. */
function inlineMd(raw) {
  let t = String(raw == null ? "" : raw);
  const toks = [];
  const hold = (kind, val) => "\u0000T" + (toks.push([kind, val]) - 1) + "\u0000";

  t = t.replace(/`([^`\n]+)`/g, (_, c) => hold("code", c));
  // Cặp `$$` nhiều dòng đã được renderMarkdown xử lý ở tầng block; ở đây chỉ
  // còn trường hợp cả hai dấu nằm trên cùng một dòng.
  t = t.replace(/\$\$([^$]+?)\$\$/g, (_, m) => hold("dm", m));
  // `$` trong "$5 và $10" là tiền tệ, không phải toán. Ba chốt chặn:
  //   `(?!\s)`  sau dấu mở: không mở bằng khoảng trắng -> loại "a $ b"
  //   `(?<![\s\\])` trước dấu đóng: không đóng bằng khoảng trắng
  //   `(?!\d)`  sau dấu đóng: "$5 và $10" -> $10 không phải toán
  t = t.replace(/(^|[^\\$])\$(?!\s)((?:\\.|[^$\n\\])+?)(?<![\s\\])\$(?!\d)/g,
    (_, pre, m) => pre + hold("m", m));
  // Gemini đính kèm grounding bằng [cite: 1] ngay trong text. Web Gemini biến
  // nó thành chip trích dẫn; ta không có URL nguồn nên hiện superscript số thứ
  // tự, thành text thô thì đọc rất khó chịu.
  t = t.replace(/\[cite:\s*([\d\s,]+)\]/gi,
    (_, nums) => hold("cite", nums.replace(/[^0-9,]/g, "")));

  let e = esc(t);
  e = e.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => {
    const u = safeUrl(url);
    return u ? '<img class="md-img" alt="' + alt + '" src="' + u + '">' : m;
  });
  e = e.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
    const u = safeUrl(url);
    return u ? '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + label + "</a>" : m;
  });

  e = e.replace(/\*\*\*([^*\n]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  e = e.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  e = e.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
  e = e.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  // Chỉ nhận `*` cho italic, cố ý KHÔNG nhận `_`: Gemini hay viết
  // `some_variable_name` và `_` làm viền sẽ nghiêng hết từ trong ngoặc.
  // Nhóm 1 là ký tự biên (để giữ lại), nhóm 2 là phần BÊN TRONG dấu sao — bắt
  // nhầm nhóm này sẽ ra `<em>*chữ*</em>` và hiện ra dấu `*` thật.
  e = e.replace(/(^|[\s([{>*~])\*([^*\n]+)\*(?=$|[\s)\]}.!?,;:*~])/g, "$1<em>$2</em>");

  return e.replace(/\u0000T(\d+)\u0000/g, (_, n) => {
    const [kind, val] = toks[+n];
    if (kind === "code") return "<code>" + esc(val) + "</code>";
    if (kind === "cite") return '<sup class="md-cite" title="Nguồn ' +
      val.replace(/,/g, ", ") + '">' + val + "</sup>";
    return renderMath(val, kind === "dm");
  });
}

function splitRow(line) {
  return line.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split(/(?<!\\)\|/).map((c) => c.trim());
}

/* Render một khối danh sách đệ quy để hỗ trợ gạch đầu dòng lồng nhau.
   Trả về chuỗi (không push vào mảng) để khối con có thể nhúng thẳng vào <li>
   của mục cha — nếu đẩy ra ngoài, ta sinh ra <ul><li>a</li><ul>...</ul></ul>,
   tức <ul> là anh em của <li>, mà HTML không cho phép. */
function renderList(items, ordered) {
  // Trừ đi thụt lề nhỏ nhất trước. Bắt buộc: giữ thụt lề tuyệt đối thì một
  // danh sách mọi dòng đều thụt (rất hay gặp) sẽ bị coi là "dòng lồng" ở mọi
  // cấp và đệ quy không bao giờ dừng.
  let base = Infinity;
  for (const it of items) base = Math.min(base, it[0]);
  if (!isFinite(base)) return "";
  const tag = ordered ? "ol" : "ul";
  const out = ["<" + tag + ">"];
  let i = 0;
  while (i < items.length) {
    if (items[i][0] - base >= 2) { i++; continue; } // dư thừa, đã xử lý ở nhánh dưới
    let html = inlineMd(items[i][1]);
    i++;
    if (i < items.length && items[i][0] - base >= 2) {
      const kids = [];
      while (i < items.length && items[i][0] - base >= 2) { kids.push(items[i]); i++; }
      html += renderList(kids, false);
    }
    out.push("<li>" + html + "</li>");
  }
  out.push("</" + tag + ">");
  return out.join("");
}

function renderMarkdown(src) {
  const lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    /* Đuôi file theo ngôn ngữ trong info string của khối code, để nút tải đặt đúng
   tên thay vì luôn `.txt`. */
const EXT_BY_LANG = {
  python: ".py", py: ".py", javascript: ".js", js: ".js", typescript: ".ts",
  ts: ".ts", java: ".java", c: ".c", cpp: ".cpp", "c++": ".cpp", csharp: ".cs",
  cs: ".cs", go: ".go", rust: ".rs", ruby: ".rb", php: ".php", swift: ".swift",
  kotlin: ".kt", sql: ".sql", bash: ".sh", sh: ".sh", shell: ".sh", json: ".json",
  yaml: ".yaml", yml: ".yml", toml: ".toml", html: ".html", css: ".css",
  xml: ".xml", markdown: ".md", md: ".md", csv: ".csv", r: ".r", lua: ".lua",
  perl: ".pl", scala: ".scala", dart: ".dart", zig: ".zig",
};

// ---- khối code ``` ... ```
    const fence = line.match(/^\s{0,3}(`{3,}|~{3,})\s*([\w+#.-]*)\s*$/);
    if (fence) {
      const mark = fence[1][0], minLen = fence[1].length, lang = fence[2];
      const buf = [];
      i++;
      while (i < lines.length) {
        const close = lines[i].match(/^\s{0,3}(`{3,}|~{3,})\s*$/);
        if (close && close[1][0] === mark && close[1].length >= minLen) { i++; break; }
        buf.push(lines[i]); i++;
      }
      /* Bọc thêm lớp `<div class="cblk">` + nút tải: Gemini không tạo được file .py/.xlsx
       để tải (đã kiểm chứng: chỉ trả code block), nên tải khối code là cách duy
       nhất để lấy được nội dung dạng file thật. Nội dung code đã escape ở trên,
       không đưa vào data-attribute để tránh phải escape hai lần. */
      out.push(
        '<div class="cblk">' +
        '<button class="dlcode" type="button">⬇ tải ' +
        esc((lang || "code") + (EXT_BY_LANG[lang.toLowerCase()] || ".txt")) +
        "</button>" +
        '<pre class="md-pre"' + (lang ? ' data-lang="' + esc(lang) + '"' : "") +
        "><code>" + esc(buf.join("\n")) + "</code></pre></div>"
      );
      continue;
    }

    // ---- khối toán $$ ... $$ nhiều dòng.
    // Nếu không có nhánh này, các dòng bên trong bị gom thành đoạn văn và tách
    // bằng <br>, nên "$$" đứng lẻ hoặc "\\frac{a}{b}" bị cắt đôi ra thành text
    // rác. Gemini rất hay xuống dòng giữa hai dấu $$ khi công thức dài.
    if (/^\s{0,3}\$\$\s*$/.test(line)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^\s{0,3}\$\$\s*$/.test(lines[i])) {
        buf.push(lines[i]); i++;
      }
      if (i < lines.length) i++; // nuốt dấu $$ đóng
      out.push(renderMath(buf.join("\n"), true));
      continue;
    }

    // ---- đường kẻ ngang
    if (/^\s{0,3}([-*_])\s*(\1\s*){2,}$/.test(line)) {
      out.push("<hr>");
      i++;
      continue;
    }

    // ---- tiêu đề # .. ######
    const head = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if (head) {
      const lvl = head[1].length;
      out.push("<h" + lvl + ">" + inlineMd(head[2].replace(/\s+#+\s*$/, "")) + "</h" + lvl + ">");
      i++;
      continue;
    }

    // ---- bảng: dòng tiêu đề có |, rồi tới dòng phân cách |---|
    if (line.indexOf("|") !== -1 && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf("-") !== -1) {
      const cols = splitRow(line).length;
      const aligns = splitRow(lines[i + 1]).map((c) => {
        const s = c.trim();
        if (/^:.*:$/.test(s)) return "center";
        if (/:$/.test(s)) return "right";
        if (/^:/.test(s)) return "left";
        return "";
      });
      const styleOf = (n) => (aligns[n] ? ' style="text-align:' + aligns[n] + '"' : "");
      i += 2;
      out.push("<table><thead><tr>");
      splitRow(line).forEach((c, n) => { out.push("<th" + styleOf(n) + ">" + inlineMd(c) + "</th>"); });
      out.push("</tr></thead><tbody>");
      while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") {
        const cells = splitRow(lines[i]);
        out.push("<tr>");
        for (let n = 0; n < cols; n++) {
          out.push("<td" + styleOf(n) + ">" + inlineMd(cells[n] || "") + "</td>");
        }
        out.push("</tr>");
        i++;
      }
      out.push("</tbody></table>");
      continue;
    }

    // ---- trích dẫn >
    if (/^\s{0,3}>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s{0,3}>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s{0,3}>\s?/, ""));
        i++;
      }
      out.push("<blockquote>" + renderMarkdown(buf.join("\n")) + "</blockquote>");
      continue;
    }

    // ---- danh sách - * + hoặc 1.
    const li = line.match(/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/);
    if (li) {
      const ordered = /\d/.test(li[2]);
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/);
        if (!m) {
          // Dòng thụt lề ngay sau gạch đầu dòng là phần tiếp của mục đó.
          if (items.length && lines[i].trim() !== "" && /^\s{2,}\S/.test(lines[i])) {
            items[items.length - 1][1] += "\n" + lines[i].trim();
            i++;
            continue;
          }
          break;
        }
        // Đổi từ "-" sang "1." trong cùng khối sẽ kết thúc khối cũ.
        if (/\d/.test(m[2]) !== ordered) break;
        items.push([m[1].replace(/\t/g, "  ").length, m[3]]);
        i++;
      }
      out.push(renderList(items, ordered));
      continue;
    }

    // ---- đoạn văn: gom tới dòng trống
    if (line.trim() === "") { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() !== "" &&
           !/^\s{0,3}(#{1,6}\s|>|`{3,}|~{3,}|\$\$\s*$)/.test(lines[i]) &&
           !/^(\s*)([-*+]|\d{1,9}[.)])\s+/.test(lines[i]) &&
           !/^\s{0,3}([-*_])\s*(\1\s*){2,}$/.test(lines[i])) {
      para.push(lines[i].trim());
      i++;
    }
    if (para.length) {
      // Xử lý TỪNG DÒNG rồi nối bằng <br>. CommonMark nghiêm có nghĩa gộp
      // newline đơn thành khoảng trắng, nhưng Gemini hay viết mỗi dòng là một
      // ý riêng ("Bước 1:...\nBước 2:..." không có gạch đầu dòng). Gộp lại sẽ
      // dính thành một khối khó đọc và lệch với đúng những gì Gemini hiện ra.
      // Tách từng dòng cũng an toàn hơn: code span/link không bao giờ chứa
      // newline nên không có regex nào bị cắt đôi.
      out.push("<p>" + para.map((l) => inlineMd(l)).join("<br>") + "</p>");
    }
    else i++;
  }
  return out.join("");
}

/* Blob URL đã tạo, để revoke khi tin nhắn bị xoá hoặc hội thoại được reset.
   Không revoke ngay sau khi tạo: ảnh chưa tải xong sẽ vỡ. */
const blobURLs = new Set();

function revokeAllBlobs() {
  for (const u of blobURLs) {
    try { URL.revokeObjectURL(u); } catch (e) {}
  }
  blobURLs.clear();
}

/* Tải media qua `fetch` + blob URL thay vì đưa thẳng `/v1/files/<id>` vào
   `src`. Lý do: endpoint đó bắt buộc API key, mà thẻ `<img src>` không gửi
   được header — nên nếu dùng URL trực tiếp thì ảnh sẽ 401. Đổi lại phải chịu
   mất range request cho video/audio (blob phải tải hết mới phát). */
async function resolveFile(url, key) {
  try {
    const r = await fetch(url, { headers: { Authorization: "Bearer " + key } });
    if (!r.ok) return null;
    const b = URL.createObjectURL(await r.blob());
    blobURLs.add(b);
    return b;
  } catch (e) {
    return null;
  }
}

function fileChip(name, mime) {
  const c = document.createElement("div");
  c.className = "filetag";
  const ic = document.createElement("strong");
  ic.textContent = "📎";
  const nm = document.createElement("span");
  nm.textContent = name;           // textContent, không innerHTML
  c.append(ic, nm);
  if (mime) {
    const m = document.createElement("small");
    m.textContent = mime;
    c.appendChild(m);
  }
  return c;
}

function addMsg(role, text, imgDataUrls, fileDocs) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : role === "error" ? "error" : "ai");
  const r = document.createElement("b");
  r.className = "role";
  r.textContent = role === "user" ? "Bạn" : role === "error" ? "Lỗi" : "Gemini";
  div.appendChild(r);
  (imgDataUrls || []).forEach((url) => {
    const im = document.createElement("img");
    im.src = url;
    div.appendChild(im);
  });
  (fileDocs || []).forEach(([b64, name]) => {
    /* Chỉ hiện tên, không render nội dung: file tài liệu không xem trực tiếp
       được trong chat, và nhúng base64 thô vào DOM chỉ tốn RAM. */
    void b64;
    div.appendChild(fileChip(name, ""));
  });
  const p = document.createElement("div");
  p.className = "md";
  div.appendChild(p);
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;

  /* Media Gemini trả về vẽ vào khối riêng, không đụng phần text để streaming
     không bị xoá mỗi chunk. */
  const media = document.createElement("div");
  media.className = "media";
  div.appendChild(media);

  const set = (t) => {
    p.innerHTML = MD_ON ? renderMarkdown(t) : "";
    if (!MD_ON) p.textContent = t || "";
  };
  set(text || "");

  set.setMedia = (list) => {
    media.innerHTML = "";
    (list || []).forEach((a) => {
      const holder = document.createElement("figure");
      if (a.kind === "video") {
        const v = document.createElement("video");
        v.controls = true;
        v.dataset.fileUrl = a.url;
        holder.appendChild(v);
      } else if (a.kind === "audio") {
        const v = document.createElement("audio");
        v.controls = true;
        v.dataset.fileUrl = a.url;
        holder.appendChild(v);
      } else {
        const im = document.createElement("img");
        im.dataset.fileUrl = a.url;
        im.alt = a.alt || a.title || "";
        holder.appendChild(im);
      }
      const btn = document.createElement("button");
      btn.className = "dl";
      btn.textContent = "⬇ " + (a.filename || a.title || "tải về");
      btn.dataset.fileUrl = a.url;
      btn.dataset.fileName = a.filename || "file";
      holder.appendChild(btn);
      media.appendChild(holder);
    });
  };
  return set;
}

/* Nạp blob cho mọi phần tử media vừa vẽ, có placeholder trong lúc chờ. */
async function hydrateMedia(root, key) {
  const nodes = root.querySelectorAll("img[data-file-url], video[data-file-url], audio[data-file-url]");
  await Promise.all(
    Array.from(nodes).map(async (n) => {
      const holder = document.createElement("span");
      holder.className = "loading";
      holder.textContent = "đang tải…";
      n.style.display = "none";
      n.parentNode.insertBefore(holder, n);
      const u = await resolveFile(n.dataset.fileUrl, key);
      if (u) {
        n.src = u;
        n.style.display = "";
        holder.remove();
      } else {
        holder.textContent = "không tải được (401/404)";
        n.remove();
      }
    })
  );
}

/* Nút tải: `<a download>` cũng không gửi được header nên phải fetch rồi mới
   kích hoạt download. Fetch lazy — chỉ khi bấm. */
async function downloadFile(url, name, key) {
  const u = await resolveFile(url, key);
  if (!u) {
    alert("Không tải được file (401 hoặc hết hạn cache).");
    return;
  }
  const a = document.createElement("a");
  a.href = u;
  a.download = name || "file";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

$("messages").addEventListener("click", (e) => {
  const b = e.target.closest("button.dl[data-file-url]");
  if (b) {
    downloadFile(b.dataset.fileUrl, b.dataset.fileName, $("apiKey").value.trim());
    return;
  }
  /* Nút tải khối code: đọc textContent của <code> ngay cạnh nút. Dùng Blob
     thuần client nên không cần qua server. */
  const cb = e.target.closest(".dlcode");
  if (cb) {
    const pre = cb.parentElement.querySelector("pre code");
    if (!pre) return;
    const label = cb.textContent.replace("⬇ tải ", "").trim();
    const url = URL.createObjectURL(
      new Blob([pre.textContent], { type: "text/plain;charset=utf-8" })
    );
    const a = document.createElement("a");
    a.href = url;
    a.download = label || "code.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
});

/* Dựng lịch sử cho request. File đính kèm giờ đi theo đúng loại: ảnh qua
   `image_url` (giữ tương thích vision), file tài liệu qua `file_data` kèm
   `filename` — không có tên thì server tạo tên ngẫu nhiên và Gemini không đọc
   được nội dung. */
function buildHistory() {
  return msgs.map((m) => ({
    role: m.role,
    content: [
      { type: "text", text: m.text },
      ...(m.images || []).map((url) => ({ type: "image_url", image_url: { url } })),
      ...(m.files || []).map(([b64, name]) => ({
        type: "file",
        file_data: b64,
        filename: name,
      })),
    ],
  }));
}

/* File đính kèm đang chờ gửi: `[dataUrl, ten, laAnh]`. Ảnh giữ data-URL để hiện
   thumbnail được; file khác gửi base64 thô qua `file_data` + `filename` để
   server giữ được đúng tên khi upload lên Gemini. */
function isImageName(name) {
  return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(name || "");
}

function humanSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(0) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

function renderThumbs() {
  $("attachments").innerHTML = "";
  attachments.forEach(([url, name, isImg], i) => {
    const w = document.createElement("div");
    w.className = "thumb";
    if (isImg) {
      const im = document.createElement("img");
      im.src = url;
      im.alt = name;
      w.appendChild(im);
    } else {
      /* Tên file đến từ máy người dùng nên phải set bằng textContent, không nối
         vào innerHTML — nếu không thì tên kiểu `<img onerror=...>` thành XSS. */
      const f = document.createElement("div");
      f.className = "filetag";
      const ic = document.createElement("strong");
      ic.textContent = "📎";
      const nm = document.createElement("span");
      nm.textContent = name;
      const sz = document.createElement("small");
      sz.textContent = humanSize(Math.floor((url.length * 3) / 4));
      f.append(ic, nm, sz);
      w.appendChild(f);
    }
    const x = document.createElement("button");
    x.textContent = "×";
    x.title = "Bỏ file này";
    x.onclick = () => { attachments.splice(i, 1); renderThumbs(); };
    w.appendChild(x);
    $("attachments").appendChild(w);
  });
}

const MAX_LOCAL_FILE = 20 * 1024 * 1024;

$("file").addEventListener("change", () => {
  for (const f of $("file").files) {
    if (f.size > MAX_LOCAL_FILE) {
      alert(`${f.name} quá lớn (${humanSize(f.size)}). Tối đa ${humanSize(MAX_LOCAL_FILE)}.`);
      continue;
    }
    const isImg = isImageName(f.name);
    const reader = new FileReader();
    /* Ảnh giữ data-URL để hiện thumbnail; file khác tách phần base64 thô ra để
       `filename` đi kèm — server cần tên đúng thì Gemini mới đọc được file. */
    reader.onload = () => {
      const result = String(reader.result || "");
      attachments.push(
        isImg ? [result, f.name, true] : [result.slice(result.indexOf(",") + 1), f.name, false]
      );
      renderThumbs();
    };
    reader.readAsDataURL(f);
  }
  $("file").value = "";
});

$("attach").onclick = () => $("file").click();

/* Bật/tắt markdown. Giữ `msgs` là nguồn sự thật nên khi đổi chế độ chỉ cần vẽ
   lại, không phải nhờ server gửi lại. */
function applyMdMode() {
  $("messages").classList.toggle("raw", !MD_ON);
  const btn = $("mdToggle");
  btn.classList.toggle("on", MD_ON);
  btn.title = MD_ON
    ? "Đang hiện markdown đã định dạng. Bấm để xem nguyên văn Gemini trả về."
    : "Đang hiện nguyên văn. Bấm để hiện markdown đã định dạnh.";
  msgs.forEach((m, idx) => {
    const holder = m._set;
    if (holder) holder(m.text);
  });
}
$("mdToggle").onclick = () => {
  MD_ON = !MD_ON;
  localStorage.setItem("gemini_md", MD_ON ? "1" : "0");
  applyMdMode();
};

$("clear").onclick = () => {
  msgs.length = 0;
  attachments = [];
  renderThumbs();
  revokeAllBlobs();
  $("messages").innerHTML = "";
  const h = document.createElement("div");
  h.className = "hint";
  h.textContent = "Đã reset hội thoại.";
  $("messages").appendChild(h);
};

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  const key = $("apiKey").value.trim();
  if (!key) { addMsg("error", "Nhập API Key trước."); return; }

  const myAttach = attachments.slice();
  attachments = [];
  renderThumbs();
  $("input").value = "";

  const imgs = myAttach.filter((a) => a[2]).map((a) => a[0]);
  const docs = myAttach.filter((a) => !a[2]).map((a) => [a[0], a[1]]);
  msgs.push({
    role: "user",
    text,
    images: imgs,
    files: docs,
    _set: addMsg("user", text, imgs, docs),
  });

  const aiSet = addMsg("ai", "");
  msgs.push({ role: "assistant", text: "", _set: aiSet });
  const aiIdx = msgs.length - 1;

  const btn = $("send");
  btn.disabled = true;

  // Stream có thể hàng trăm chunk; render lại toàn bộ markdown mỗi chunk thì
  // rẻ hơn nhiều so với nối chuỗi vào DOM, nhưng vẫn gom theo frame để không
  // dựng lại cây DOM 60 lần/giây.
  let acc = "", raf = 0;
  const flush = () => {
    raf = 0;
    aiSet(acc);
    msgs[aiIdx].text = acc;
    $("messages").scrollTop = $("messages").scrollHeight;
  };
  const schedule = () => { if (!raf) raf = requestAnimationFrame(flush); };

  const body = {
    model: $("model").value.trim() || null,
    stream: true,
    messages: buildHistory(),
  };

  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key,
      },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      let detail = "HTTP " + resp.status;
      try { const j = await resp.json(); detail = j.detail || j.error?.message || detail; } catch (e) {}
      acc = "⚠️ " + detail;
      aiSet(acc);
      msgs[aiIdx].text = acc;
      return;
    }

const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let done = false;
      let gotMedia = false;
      while (!done) {
        const { value, done: d } = await reader.read();
        done = d;
        buf += decoder.decode(value || new Uint8Array(), { stream: !done });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const p of parts) {
          for (const line of p.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (data === "[DONE]") continue;
            try {
              const j = JSON.parse(data);
              if (j.choices?.[0]?.delta?.content) {
                acc += j.choices[0].delta.content;
                schedule();
              }
              /* Media về ở chunk cuối nên vẽ khi stream đã xong, tránh phải dựng
                 lại media mỗi lần text đổi. */
              const att = j.choices?.[0]?.delta?.attachments;
              if (att && att.length && !gotMedia) {
                gotMedia = true;
                msgs[aiIdx].attachments = att;
                aiSet.setMedia(att);
                hydrateMedia($("messages").lastElementChild, key).then(() => {
                  $("messages").scrollTop = $("messages").scrollHeight;
                });
              }
              if (j.error) acc += "\n\n> ⚠️ " + (j.error.message || "lỗi không rõ");
            } catch (e) {}
          }
        }
      }
    } catch (e) {
      acc += (acc ? "\n\n" : "") + "Lỗi kết nối: " + e.message;
      msgs[aiIdx].text = acc;
    } finally {
      if (raf) cancelAnimationFrame(raf);
      flush();
      btn.disabled = false;
      $("input").focus();
    }
  }

$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
window.addEventListener("beforeunload", revokeAllBlobs);
applyMdMode();
</script>
</body>
</html>
